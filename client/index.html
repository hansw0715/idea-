<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 위쪽 상태 표시줄 색: 휴대폰이 다크 모드면 어둡게 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <!-- 밝은·다크 화면을 사이트가 직접 지원한다고 알린다. 브라우저(삼성 인터넷 등)가 다크 모드에서
         색을 제멋대로 바꾸지 않고 tokens.css 의 다크 색을 쓰게 한다 -->
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="같이 밥 먹고, 같이 만나고, 같이 이용하는 한성 캠퍼스 연결 플랫폼 상상Book-E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="상상Book-E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>상상Book-E</title>
    <script>
      // 정해 둔 브라우저가 아니면 들어오자마자 그 브라우저로 다시 연다 (카카오톡 등 앱 안 브라우저, 삼성 인터넷, 사파리, 구글 앱 모두).
      // 안드로이드·아이폰 모두 크롬. 없으면 그대로 둔다. 설치한 앱으로 연 화면은 넘기지 않는다.
      // (크롬으로 설치해야 다크 모드에서 검은 시작 화면 등 앱 설정 파일의 색이 그대로 쓰인다)
      (function () {
        var ua = navigator.userAgent || '';
        var url = location.href;
        var android = /android/i.test(ua);
        var ios = /iphone|ipad|ipod/i.test(ua);
        var inApp = /KAKAOTALK|Line\/|NAVER|Instagram|FBAN|FBAV|everytimeApp|DaumApps|wv\)/i.test(ua);
        var installedApp =
          navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        // 크롬: 같은 엔진을 쓰는 다른 브라우저(삼성 인터넷·엣지·오페라·웨일 등)와 구글 앱(GSA)은 뺀다
        var chrome =
          /Chrome\/[\d.]+/.test(ua) &&
          !/SamsungBrowser|EdgA|OPR\/|Whale|YaBrowser|UCBrowser|MiuiBrowser|HeyTap|DuckDuckGo|GSA\/|Version\/[\d.]+ Chrome/i.test(ua) &&
          !inApp;
        // 아이폰 크롬은 CriOS 로 알린다
        var chromeIos = /CriOS\//.test(ua) && !inApp;
        if (installedApp || (android && chrome) || (ios && chromeIos)) return;
        // 크롬이 없어 되돌아온 경우(stay=1)에는 다시 넘기지 않는다 (무한 반복 방지)
        if (/[?&]stay=1/.test(url) || (!android && !ios && !inApp)) return;
        if (android) {
          location.href =
            'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
            encodeURIComponent(
              /KAKAOTALK/i.test(ua)
                ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url)
                : url + (url.indexOf('?') < 0 ? '?' : '&') + 'stay=1',
            ) +
            ';end';
        } else if (ios) {
          // 아이폰은 googlechrome(s):// 주소로 크롬에 넘긴다 (크롬에서도 공유 → 홈 화면에 추가로 설치된다, iOS 16.4 이상).
          // 크롬이 없거나 열기를 취소하면 화면이 그대로 남는다. 이 탭에서는 한 번만 시도해 경고가 반복되지 않게 하고,
          // 카카오톡은 기본 브라우저로 내보낸다 (거기서 다시 크롬으로 넘긴다)
          try {
            if (sessionStorage.getItem('sb-to-chrome')) return;
            sessionStorage.setItem('sb-to-chrome', '1');
          } catch (e) {}
          location.href = url.replace(/^http(s?):\/\//, 'googlechrome$1://');
          if (/KAKAOTALK/i.test(ua))
            setTimeout(function () {
              if (!document.hidden) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
            }, 1500);
        } else if (/KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
          location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
        }
      })();
    </script>
    <link rel="icon" href="/brand/app-icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/app-icon-apple.png" />
    <script>
      // 지금 화면 모드(앱 "내 정보 → 화면"에서 고른 밝게·어둡게, 아니면 휴대폰 설정)를
      //  1) 로딩 화면(#splash) 색 — html[data-splash]
      //  2) 앱 설정 파일(/api/manifest) 주소와 쿠키 — 안드로이드가 설치·업데이트 때 이 색으로 시작 화면·버튼 줄을 칠한다
      // 에 반영한다. 앱 안에서 모드를 바꾸면 ui/Display.tsx 가 window.__sbScheme() 을 다시 부른다
      (function () {
        try {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var manifest = document.createElement('link');
          manifest.rel = 'manifest';
          manifest.crossOrigin = 'use-credentials';
          var apply = function () {
            var chosen = null;
            try {
              chosen = localStorage.getItem('sangsang-booke:appearance');
            } catch (e) {}
            var scheme = chosen === 'dark' || chosen === 'light' ? chosen : mq.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-splash', scheme);
            document.cookie = 'sb-scheme=' + scheme + '; path=/; max-age=31536000; samesite=lax; secure';
            // 설치할 때 이 파일을 쿠키 없이 받아도 맞는 색이 되도록 주소에 모드를 넣는다 (server/manifest.ts)
            manifest.href = '/api/manifest?scheme=' + scheme;
          };
          apply();
          document.head.appendChild(manifest);
          window.__sbScheme = apply;
          mq.addEventListener('change', apply);
        } catch (e) {
          // 모드를 못 읽어도 설치는 되도록 기본 설정 파일은 건다
          if (!document.querySelector('link[rel="manifest"]')) {
            var fallback = document.createElement('link');
            fallback.rel = 'manifest';
            fallback.href = '/api/manifest';
            fallback.crossOrigin = 'use-credentials';
            document.head.appendChild(fallback);
          }
        }
      })();
    </script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- KRDS 기본 서체 Pretendard GOV -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
    />
    <!-- 앱을 열 때 보이는 로딩 화면 (자바스크립트보다 먼저 그려진다). 앱이 준비되면 shell/splash.ts 가 걷어 낸다 -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1e2124;
        font-family: 'Pretendard GOV Variable', 'Pretendard GOV', system-ui, -apple-system, sans-serif;
        transition: opacity 200ms ease-out, visibility 0s linear 200ms;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash__inner {
        display: grid;
        justify-items: center;
        gap: 14px;
        transition: transform 280ms ease-out;
      }
      #splash.is-done .splash__inner {
        transform: scale(1.04);
      }
      .splash__mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgb(20 89 166 / 0.18);
        animation: splash-pop 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash__name {
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
      }
      .splash__scope {
        margin: -8px 0 0;
        font-size: 13px;
        color: #6d7882;
        animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 200ms both;
      }
      .splash__bar {
        position: relative;
        width: 120px;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(20 89 166 / 0.12);
        animation: splash-rise 400ms ease-out 320ms both;
      }
      .splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #1459a6;
        animation: splash-load 1100ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.82); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      /* 지금 화면 모드(data-splash: 앱에서 고른 모드, 아니면 휴대폰 설정)를 따른다. 스크립트가 못 돌면 휴대폰 설정 */
      @media (prefers-color-scheme: dark) {
        html:not([data-splash]) #splash { background: #16181b; color: #f4f5f6; }
        html:not([data-splash]) .splash__scope { color: #a1a9b0; }
        html:not([data-splash]) .splash__mark { box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); }
        html:not([data-splash]) .splash__bar { background: rgb(255 255 255 / 0.12); }
        html:not([data-splash]) .splash__bar::after { background: #6aa7ec; }
      }
      html[data-splash='dark'] #splash { background: #16181b; color: #f4f5f6; }
      html[data-splash='dark'] .splash__scope { color: #a1a9b0; }
      html[data-splash='dark'] .splash__mark { box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); }
      html[data-splash='dark'] .splash__bar { background: rgb(255 255 255 / 0.12); }
      html[data-splash='dark'] .splash__bar::after { background: #6aa7ec; }
      /* 움직임 줄이기: 튀어 오르기·이동 없이 나타나고 사라지기만 */
      @media (prefers-reduced-motion: reduce) {
        .splash__mark, .splash__name, .splash__scope, .splash__bar { animation: none; }
        .splash__bar::after { animation-duration: 2400ms; }
        #splash.is-done .splash__inner { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="상상Book-E 불러오는 중">
      <div class="splash__inner">
        <img class="splash__mark" src="/brand/app-icon-192.png" alt="" width="88" height="88" />
        <p class="splash__name">상상Book-E</p>
        <p class="splash__scope">한성대학교 캠퍼스</p>
        <div class="splash__bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
