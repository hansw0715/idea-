<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 위쪽 상태 표시줄 색: 휴대폰이 다크 모드면 어둡게 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <!-- 밝은·다크 화면을 사이트가 직접 지원한다고 알린다. 브라우저(삼성 인터넷 등)가 다크 모드에서
         색을 제멋대로 바꾸지 않고 tokens.css 의 다크 색을 쓰게 한다 -->
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="같이 밥 먹고, 같이 만나고, 같이 이용하는 한성 캠퍼스 연결 플랫폼 상상Book-E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="상상Book-E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>상상Book-E</title>
    <script>
      // 정해 둔 브라우저가 아니면 들어오자마자 그 브라우저로 다시 연다 (카카오톡 등 앱 안 브라우저, 크롬, 구글 앱 모두).
      // 안드로이드는 삼성 인터넷, 아이폰은 사파리. 없으면 그대로 둔다. 설치한 앱으로 연 화면은 넘기지 않는다.
      (function () {
        var ua = navigator.userAgent || '';
        var url = location.href;
        var android = /android/i.test(ua);
        var ios = /iphone|ipad|ipod/i.test(ua);
        var inApp = /KAKAOTALK|Line\/|NAVER|Instagram|FBAN|FBAV|everytimeApp|DaumApps|wv\)/i.test(ua);
        var installedApp =
          navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        var samsung = /SamsungBrowser/i.test(ua) && !inApp;
        var safari = /Version\/[\d.]+.*Safari\//.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA\/|Whale|YaBrowser|DuckDuckGo/i.test(ua) && !inApp;
        if (installedApp || (android && samsung) || (ios && safari)) return;
        // 삼성 인터넷이 없어 되돌아온 경우(stay=1)에는 다시 넘기지 않는다 (무한 반복 방지)
        if (/[?&]stay=1/.test(url) || (!android && !ios && !inApp)) return;
        if (android) {
          location.href =
            'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.sec.android.app.sbrowser;S.browser_fallback_url=' +
            encodeURIComponent(
              /KAKAOTALK/i.test(ua)
                ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url)
                : url + (url.indexOf('?') < 0 ? '?' : '&') + 'stay=1',
            ) +
            ';end';
        } else if (ios) {
          // 아이폰은 사파리로 연다 (iOS 17 이상). 안 열리면 카카오톡은 기본 브라우저로
          location.href = 'x-safari-' + url;
          if (/KAKAOTALK/i.test(ua))
            setTimeout(function () {
              location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
            }, 1500);
        } else if (/KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
          location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
        }
      })();
    </script>
    <link rel="icon" href="/brand/app-icon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/app-icon-apple.png" />
    <script>
      // 휴대폰의 화면 모드를 쿠키로 알려 둔다. 앱 설정 파일(/api/manifest)이 이걸 보고
      // 설치한 앱의 맨 아래 버튼 줄 색을 정한다. 휴대폰 설정이 바뀌면 다시 적는다
      (function () {
        try {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var save = function () {
            document.cookie = 'sb-scheme=' + (mq.matches ? 'dark' : 'light') + '; path=/; max-age=31536000; samesite=lax; secure';
          };
          save();
          mq.addEventListener('change', save);
          // 안드로이드 시작 화면 색은 설치(다운로드)할 때의 화면 모드로 정해진다.
          // 그 뒤에 보이는 로딩 화면(#splash)도 같은 색이 되도록 설치 때 모드를 기억해 둔다
          var KEY = 'sb-install-scheme';
          var now = function () {
            return mq.matches ? 'dark' : 'light';
          };
          window.addEventListener('appinstalled', function () {
            try {
              localStorage.setItem(KEY, now());
            } catch (e) {}
          });
          var installed = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
          if (installed) {
            var scheme = localStorage.getItem(KEY);
            if (scheme !== 'dark' && scheme !== 'light') {
              // 이 기능 전에 설치했거나 설치 신호를 못 받았으면 첫 실행 때 모드를 쓴다
              scheme = now();
              localStorage.setItem(KEY, scheme);
            }
            document.documentElement.setAttribute('data-splash', scheme);
          }
        } catch (e) {}
      })();
    </script>
    <!-- 쿠키(sb-scheme)를 함께 보내야 서버가 휴대폰 화면 모드를 안다 (설정 파일은 기본으로 쿠키 없이 받는다) -->
    <link rel="manifest" href="/api/manifest" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- KRDS 기본 서체 Pretendard GOV -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
    />
    <!-- 앱을 열 때 보이는 로딩 화면 (자바스크립트보다 먼저 그려진다). 앱이 준비되면 shell/splash.ts 가 걷어 낸다 -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #ffffff;
        color: #1e2124;
        font-family: 'Pretendard GOV Variable', 'Pretendard GOV', system-ui, -apple-system, sans-serif;
        transition: opacity 280ms ease-out, visibility 0s linear 280ms;
      }
      #splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash__inner {
        display: grid;
        justify-items: center;
        gap: 14px;
        transition: transform 280ms ease-out;
      }
      #splash.is-done .splash__inner {
        transform: scale(1.04);
      }
      .splash__mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgb(20 89 166 / 0.18);
        animation: splash-pop 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .splash__name {
        margin: 6px 0 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
      }
      .splash__scope {
        margin: -8px 0 0;
        font-size: 13px;
        color: #6d7882;
        animation: splash-rise 520ms cubic-bezier(0.22, 1, 0.36, 1) 200ms both;
      }
      .splash__bar {
        position: relative;
        width: 120px;
        height: 3px;
        margin-top: 18px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(20 89 166 / 0.12);
        animation: splash-rise 400ms ease-out 320ms both;
      }
      .splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: #1459a6;
        animation: splash-load 1100ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.82); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-load {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      /* 설치한 앱은 설치 때 화면 모드(data-splash), 브라우저는 지금 휴대폰 모드를 따른다 */
      @media (prefers-color-scheme: dark) {
        html:not([data-splash='light']) #splash { background: #16181b; color: #f4f5f6; }
        html:not([data-splash='light']) .splash__scope { color: #a1a9b0; }
        html:not([data-splash='light']) .splash__mark { box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); }
        html:not([data-splash='light']) .splash__bar { background: rgb(255 255 255 / 0.12); }
        html:not([data-splash='light']) .splash__bar::after { background: #6aa7ec; }
      }
      html[data-splash='dark'] #splash { background: #16181b; color: #f4f5f6; }
      html[data-splash='dark'] .splash__scope { color: #a1a9b0; }
      html[data-splash='dark'] .splash__mark { box-shadow: 0 10px 30px rgb(0 0 0 / 0.4); }
      html[data-splash='dark'] .splash__bar { background: rgb(255 255 255 / 0.12); }
      html[data-splash='dark'] .splash__bar::after { background: #6aa7ec; }
      /* 움직임 줄이기: 튀어 오르기·이동 없이 나타나고 사라지기만 */
      @media (prefers-reduced-motion: reduce) {
        .splash__mark, .splash__name, .splash__scope, .splash__bar { animation: none; }
        .splash__bar::after { animation-duration: 2400ms; }
        #splash.is-done .splash__inner { transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="상상Book-E 불러오는 중">
      <div class="splash__inner">
        <img class="splash__mark" src="/brand/app-icon-192.png" alt="" width="88" height="88" />
        <p class="splash__name">상상Book-E</p>
        <p class="splash__scope">한성대학교 캠퍼스</p>
        <div class="splash__bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
