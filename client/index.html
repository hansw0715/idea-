<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="같이 밥 먹고, 같이 만나고, 같이 이용하는 한성 캠퍼스 연결 플랫폼 상상Book-E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="상상Book-E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>상상Book-E</title>
    <script>
      // 카카오톡 등 앱 안 브라우저에서는 홈 화면에 추가할 수 없어, 들어오자마자 기본 브라우저(크롬·사파리)로 다시 연다
      (function () {
        var ua = navigator.userAgent || '';
        var url = location.href;
        if (/KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
          location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
        } else if (/android/i.test(ua) && /NAVER|Instagram|FBAN|FBAV|everytimeApp|DaumApps|wv\)/i.test(ua)) {
          location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        }
      })();
    </script>
    <link rel="icon" href="/brand/mark-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- KRDS 기본 서체 Pretendard GOV -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
