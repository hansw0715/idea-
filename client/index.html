<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 위쪽 상태 표시줄 색: 휴대폰이 다크 모드면 어둡게 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="같이 밥 먹고, 같이 만나고, 같이 이용하는 한성 캠퍼스 연결 플랫폼 상상Book-E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="상상Book-E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>상상Book-E</title>
    <script>
      // 카카오톡 등 앱 안 브라우저에서는 홈 화면에 추가할 수 없어, 들어오자마자 바깥 브라우저로 다시 연다.
      // 안드로이드는 크롬으로, 크롬이 없으면 기본 브라우저로 연다.
      (function () {
        var ua = navigator.userAgent || '';
        var url = location.href;
        var android = /android/i.test(ua);
        var inApp = /KAKAOTALK|Line\/|NAVER|Instagram|FBAN|FBAV|everytimeApp|DaumApps|wv\)/i.test(ua);
        // 크롬이 없어 되돌아온 경우(stay=1)에는 다시 넘기지 않는다 (무한 반복 방지)
        if (!inApp || /[?&]stay=1/.test(url)) return;
        if (android) {
          location.href =
            'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
            encodeURIComponent(
              /KAKAOTALK/i.test(ua)
                ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url)
                : url + (url.indexOf('?') < 0 ? '?' : '&') + 'stay=1',
            ) +
            ';end';
        } else if (/iphone|ipad|ipod/i.test(ua)) {
          // 아이폰은 크롬이 기본 브라우저여도 사파리로 연다 (iOS 17 이상). 안 열리면 카카오톡은 기본 브라우저로
          location.href = 'x-safari-' + url;
          if (/KAKAOTALK/i.test(ua))
            setTimeout(function () {
              location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
            }, 1500);
        } else if (/KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
          location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
        }
      })();
    </script>
    <link rel="icon" href="/brand/mark-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <script>
      // 휴대폰의 화면 모드를 쿠키로 알려 둔다. 앱 설정 파일(/api/manifest)이 이걸 보고
      // 설치한 앱의 맨 아래 버튼 줄 색을 정한다. 휴대폰 설정이 바뀌면 다시 적는다
      (function () {
        try {
          var mq = window.matchMedia('(prefers-color-scheme: dark)');
          var save = function () {
            document.cookie = 'sb-scheme=' + (mq.matches ? 'dark' : 'light') + '; path=/; max-age=31536000; samesite=lax; secure';
          };
          save();
          mq.addEventListener('change', save);
        } catch (e) {}
      })();
    </script>
    <!-- 쿠키(sb-scheme)를 함께 보내야 서버가 휴대폰 화면 모드를 안다 (설정 파일은 기본으로 쿠키 없이 받는다) -->
    <link rel="manifest" href="/api/manifest" crossorigin="use-credentials" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- KRDS 기본 서체 Pretendard GOV -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
