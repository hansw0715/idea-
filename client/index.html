<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- 휴대폰 다크 모드(크롬·삼성 인터넷의 강제 어둡게)가 색을 바꾸지 않게 한다.
         어두운 화면은 내 정보 → 설정의 다크 모드로만 켠다 (Display.tsx 가 이 값을 바꾼다) -->
    <meta name="color-scheme" content="only light" />
    <script>
      // 화면 모드를 첫 화면이 그려지기 전에 적용한다 (Display.tsx 와 같은 규칙):
      // 설정에서 직접 고른 값이 없으면 휴대폰의 다크/라이트 모드를 따른다
      (function () {
        try {
          var saved = localStorage.getItem('sangsang-booke-theme-choice');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (!dark) return;
          document.documentElement.setAttribute('data-theme', 'dark');
          document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'only dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#16181b');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="같이 밥 먹고, 같이 만나고, 같이 이용하는 한성 캠퍼스 연결 플랫폼 상상Book-E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="상상Book-E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>상상Book-E</title>
    <script>
      // 카카오톡 등 앱 안 브라우저에서는 홈 화면에 추가할 수 없어, 들어오자마자 바깥 브라우저로 다시 연다.
      // 안드로이드는 크롬으로 연다: 크롬은 color-scheme: only light 를 지켜 강제 다크 모드를 걸지 않지만,
      // 삼성 인터넷의 "웹 콘텐츠 강제 다크 모드"는 사이트가 막을 방법이 없다. 크롬이 없으면 기본 브라우저로.
      (function () {
        var ua = navigator.userAgent || '';
        var url = location.href;
        var android = /android/i.test(ua);
        var inApp = /KAKAOTALK|Line\/|NAVER|Instagram|FBAN|FBAV|everytimeApp|DaumApps|wv\)/i.test(ua);
        // 크롬이 없어 되돌아온 경우(stay=1)에는 다시 넘기지 않는다 (무한 반복 방지)
        if (!inApp || /[?&]stay=1/.test(url)) return;
        if (android) {
          location.href =
            'intent://' + url.replace(/^https?:\/\//, '') +
            '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' +
            encodeURIComponent(
              /KAKAOTALK/i.test(ua)
                ? 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url)
                : url + (url.indexOf('?') < 0 ? '?' : '&') + 'stay=1',
            ) +
            ';end';
        } else if (/iphone|ipad|ipod/i.test(ua)) {
          // 아이폰은 크롬이 기본 브라우저여도 사파리로 연다 (iOS 17 이상). 안 열리면 카카오톡은 기본 브라우저로
          location.href = 'x-safari-' + url;
          if (/KAKAOTALK/i.test(ua))
            setTimeout(function () {
              location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
            }, 1500);
        } else if (/KAKAOTALK/i.test(ua)) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        } else if (/Line\//i.test(ua) && url.indexOf('openExternalBrowser=1') < 0) {
          location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
        }
      })();
    </script>
    <link rel="icon" href="/brand/mark-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <!-- KRDS 기본 서체 Pretendard GOV -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
